services:

  postgres:
    image: postgres:16
    container_name: smart_meter_postgres
    environment:
      POSTGRES_DB: smart_meter
      POSTGRES_USER: smart_meter_user
      POSTGRES_PASSWORD: smart_meter_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: smart_meter_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: